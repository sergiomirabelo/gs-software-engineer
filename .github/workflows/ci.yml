name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Validar contrato OpenAPI
        run: openapi-spec-validator openapi/2_contrato_api.yaml
      - name: Nenhuma chave no repositório
        run: "! grep -rEn '(sk-[A-Za-z0-9]{20,}|API_KEY *= *[A-Za-z0-9])' src tests"
      - name: Testes (cobertura mínima 70%)
        run: pytest --cov=src --cov-fail-under=70
